<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jokenpô — Jogos Interativos</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/jokenpo.css">
</head>
<body class="game-page">

  <a href="index.html" class="back-link">← voltar</a>

  <main class="arena">

    <h1 class="arena-title">Jokenpô</h1>

    <!-- Placar -->
    <div class="scoreboard">
      <div class="score-side">
        <span class="score-label">Você</span>
        <span class="score-num" id="score-player">0</span>
      </div>
      <span class="score-sep">×</span>
      <div class="score-side">
        <span class="score-label">CPU</span>
        <span class="score-num" id="score-cpu">0</span>
      </div>
    </div>

    <!-- Campo de batalha -->
    <div class="battlefield">
      <div class="fighter">
        <span class="fighter-label">Você</span>
        <div class="fighter-hand" id="hand-player">🤜</div>
      </div>
      <span class="vs-badge">VS</span>
      <div class="fighter">
        <span class="fighter-label">CPU</span>
        <div class="fighter-hand" id="hand-cpu">🤛</div>
      </div>
    </div>

    <!-- Status IA -->
    <p class="ia-thinking" id="ia-status"></p>

    <!-- Resultado -->
    <p class="result-banner empty" id="result-banner">—</p>

    <!-- Escolhas -->
    <div class="choices">
      <button class="choice-btn" data-choice="pedra"   onclick="play('pedra')">
        <span class="c-icon">✊</span>
        <span class="c-label">Pedra</span>
      </button>
      <button class="choice-btn" data-choice="papel"   onclick="play('papel')">
        <span class="c-icon">✋</span>
        <span class="c-label">Papel</span>
      </button>
      <button class="choice-btn" data-choice="tesoura" onclick="play('tesoura')">
        <span class="c-icon">✌️</span>
        <span class="c-label">Tesoura</span>
      </button>
    </div>

    <!-- Histórico -->
    <div class="history-wrap">
      <p class="history-title">Histórico</p>
      <div class="history-list" id="history-list"></div>
    </div>

    <button class="reset-btn" onclick="resetGame()">Reiniciar placar</button>

  </main>

  <footer class="footer">
    <p>© 2026</p>
  </footer>

  <script src="js/jokenpo.js"></script>

</body>
</html>
