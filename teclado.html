<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teclado Virtual</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/teclado.css">
</head>
<body>

  <header class="header">
    <h1>Teclado Virtual</h1>
    <div class="header-right">
      <a href="index.html">← Voltar</a>
    </div>
  </header>

  <main>

    <!-- Nota tocando -->
    <div class="nota-display">
      <div class="nota-nome" id="nota-nome">—</div>
      <div class="nota-freq" id="nota-freq">Toque uma tecla</div>
    </div>

    <!-- Visualizador de ondas -->
    <div class="visualizador" id="visualizador"></div>

    <!-- Histórico -->
    <div class="historico" id="historico"></div>

    <!-- Teclado -->
    <div class="teclado-container">
      <div class="teclado" id="teclado"></div>
    </div>

    <!-- Oitava -->
    <div class="controls-row">
      <button class="btn-ctrl" onclick="mudarOitava(-1)">↓ Oitava</button>
      <span id="oitava-label" style="font-family:var(--font-disp);font-size:20px;letter-spacing:2px;color:var(--muted);align-self:center;">4</span>
      <button class="btn-ctrl" onclick="mudarOitava(1)">↑ Oitava</button>
      <button class="btn-ctrl" id="btn-rec" onclick="toggleGravacao()">⏺ Gravar</button>
      <button class="btn-ctrl" id="btn-play" onclick="reproduzir()" disabled>▶ Reproduzir</button>
    </div>

    <!-- Gravação -->
    <div class="gravacao-bar" id="gravacao-bar">
      <div class="rec-dot" id="rec-dot"></div>
      <span class="gravacao-label" id="gravacao-label">Pronto para gravar</span>
      <span class="gravacao-notas" id="gravacao-notas"></span>
    </div>

  </main>

  <footer class="footer"><p>© 2026</p></footer>

 <script src="js/teclado.js"></script>

</body>
</html>
